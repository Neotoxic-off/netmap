[package]
name = "netmap"
version = "0.1.0"
edition = "2021"

[dependencies]
dns-lookup = "2"
if-addrs = "0.15.0"
mac_oui = { version = "0.4", features = ["with-db"] }
# Pinned exactly: `line_count` (wrapped-line count, needed to scroll correctly) is an unstable API.
ratatui = { version = "=0.29.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
